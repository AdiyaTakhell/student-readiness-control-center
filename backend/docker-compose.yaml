services:
  postgres:
    image: postgres:18.6
    container_name: readiness-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: readiness
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d readiness"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo:
    image: mongo:8.0.32
    container_name: readiness-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: readiness
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-app}

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username app --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  mongo-data: